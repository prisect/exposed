plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = 'exposed'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation include("io.github.spair:imgui-java-binding:${project.imgui_version}")
	implementation(include("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")) {
		exclude group: 'org.lwjgl'
	}
	implementation include("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
	implementation include("io.github.spair:imgui-java-natives-linux:${project.imgui_version}")
	implementation include("io.github.spair:imgui-java-natives-macos:${project.imgui_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.register('validateModIcon') {
	def sourceIconFile = layout.projectDirectory.file('docs/icon.png')
	def iconFile = layout.projectDirectory.file('src/main/resources/assets/exposed/icon.png')
	def metadataFile = layout.projectDirectory.file('src/main/resources/fabric.mod.json')
	inputs.files(sourceIconFile, iconFile, metadataFile)

	doLast {
		if (!sourceIconFile.asFile.exists()) {
			throw new GradleException("Missing source Mod Menu icon: ${sourceIconFile.asFile}")
		}
		def icon = iconFile.asFile
		if (!java.util.Arrays.equals(sourceIconFile.asFile.bytes, icon.bytes)) {
			throw new GradleException("Packaged Mod Menu icon must match docs/icon.png")
		}

		if (!icon.exists()) {
			throw new GradleException("Missing Mod Menu icon: ${icon}")
		}

		def image = javax.imageio.ImageIO.read(icon)

		if (image == null) {
			throw new GradleException("Mod Menu icon is not a readable PNG: ${icon}")
		}

		def width = image.width
		def height = image.height
		image.flush()

		if (width != height) {
			throw new GradleException("Mod Menu icon must be square, got ${width}x${height}")
		}

		if (width < 64) {
			throw new GradleException("Mod Menu icon must be at least 64x64, got ${width}x${height}")
		}

		if (!metadataFile.asFile.text.contains('"icon": "assets/exposed/icon.png"')) {
			throw new GradleException("fabric.mod.json does not point at assets/exposed/icon.png")
		}

		logger.lifecycle("Mod Menu icon OK: ${width}x${height}, ${icon.length()} bytes")
	}
}

processResources.dependsOn tasks.named('validateModIcon')

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
