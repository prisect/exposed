plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = 'exposed'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation include("io.github.spair:imgui-java-binding:${project.imgui_version}")
	implementation(include("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")) {
		exclude group: 'org.lwjgl'
	}
	implementation include("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
	implementation include("io.github.spair:imgui-java-natives-linux:${project.imgui_version}")
	implementation include("io.github.spair:imgui-java-natives-macos:${project.imgui_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
